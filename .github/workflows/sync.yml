name: Sync auction history

on:
  schedule:
    # Daily at 04:17 UTC — after Radar's board has settled for the day. The run
    # is a single idempotent upsert: it downloads Radar's snapshot and merges it
    # into the month-partitioned shards, touching only shards that changed.
    - cron: "17 4 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/sync.yml"

# Only the HF push needs credentials; the repo itself is read-only here.
permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    # Above radar.py's worst-case retry budget (~9 min); keep the two in sync.
    timeout-minutes: 15
    env:
      HF_REPO_ID: ${{ vars.HF_REPO_ID }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      # `uv run` syncs the locked env itself — no separate `uv sync` step.
      - name: Upsert today's board into the HF dataset (+ regenerate the card)
        run: uv run hetzner-auction-history sync

  # GitHub disables a public repo's scheduled workflows after 60 days with no
  # repository activity (it did here around 2026-09-09: the sync writes only to
  # HF, never a commit). Re-enabling the workflow from its own daily run resets
  # that clock without commits.
  keepalive:
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/sync.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
