[project]
name = "hetzner-auction-history"
version = "0.1.0"
description = "Accumulate the Hetzner server-auction board into a public HuggingFace dataset as month-partitioned Parquet."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
authors = [{ name = "ak2k" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "duckdb>=1.1",
    "httpx>=0.27",
    "huggingface-hub>=0.25",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.7",
    "pydantic-settings>=2.7",
    "stamina>=24",
    "structlog>=24",
    "typer>=0.12",
]

[project.scripts]
hetzner-auction-history = "hetzner_auction_history.cli:main"

[dependency-groups]
dev = [
    "basedpyright>=1.20",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hetzner_auction_history"]

# --- ruff: lint + format ---
[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle + pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "SIM",           # simplify
    "RUF",           # ruff-specific
    "PTH",           # pathlib over os.path
    "TC",            # TYPE_CHECKING import discipline
    "RET",           # return-statement hygiene
    "PIE",           # misc anti-patterns
    "PL",            # pylint subset
    "ANN",           # require annotations
    "S",             # bandit (security)
    "TRY",           # try/except hygiene
    "BLE",           # no bare except
    "N",             # naming
    "D",             # docstrings (relaxed in tests)
]
ignore = [
    "D100", "D104", "D107",
    "ANN401",
    "TRY003",
    "PLR0913",       # DIVERGE (Profile A): verb signatures are wide
    "D203", "D213", "COM812",
]

[tool.ruff.lint.per-file-ignores]
# S608: tests build DuckDB SQL from tmp_path fixtures, not untrusted input.
# S105/S106: fake HF tokens in fixtures are not real secrets.
"tests/**" = ["S101", "D", "ANN", "PLR2004", "S608", "S105", "S106"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# --- basedpyright: types ---
[tool.basedpyright]
include = ["src", "tests"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
# duckdb / huggingface_hub ship partial or no stubs; downgrade the missing-stub
# noise but keep strict everywhere we control.
reportMissingTypeStubs = "none"
reportImplicitOverride = "error"
reportUnusedCallResult = "none"
reportAny = "warning"
# DIVERGE (Profile B): duckdb's connection API and pandas' DataFrame surface
# Unknown member/argument/variable types; we isolate them in convert.py and
# downgrade these to warnings rather than littering ignores. Boundary models
# (Pydantic) stay fully typed.
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config --cov=src --cov-report=term-missing:skip-covered"
xfail_strict = true
filterwarnings = ["error"]
markers = []

# --- coverage ---
[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_also = [
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
show_missing = true
fail_under = 60  # DIVERGE (Profile A): network/CLI paths are hard to unit-cover
